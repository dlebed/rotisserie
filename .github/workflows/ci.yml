name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    env:
      ROTISSERIE_NO_OPEN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the end-to-end smoke test runs the bundles in dist/.
      - run: npm run build
      - run: npm test
        if: matrix.node != 20
      # The page tests need jsdom, whose current release does not start on Node 20. Node 20 still runs
      # everything the plugin executes at run time: the server, the MCP tools, the wait command and the smoke test.
      - run: npx vitest run --project node
        if: matrix.node == 20
      - name: Committed dist/ is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          git diff --exit-code -- dist/
          # git diff ignores untracked files: a build output nobody committed shows up only here.
          test -z "$(git status --porcelain -- dist/)" || { git status --porcelain -- dist/; exit 1; }
